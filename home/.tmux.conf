# ==============================================================================
# .tmux.conf
# ==============================================================================

# Terminal and colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",tmux-256color:RGB"
set -g focus-events on
set -sg escape-time 10

# Prefix key (Ctrl-a, screen-style)
unbind C-b
set -g prefix C-a
bind C-a last-window
bind a send-prefix

# Windows and panes
set -g base-index 1
set -g renumber-windows on
set-option -g allow-rename off
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigation
bind -n M-Left previous-window
bind -n M-Right next-window

# Mouse and macOS clipboard (pbcopy is harmlessly unavailable elsewhere).
set -g mouse on
if-shell '[ "$(uname -s)" = Darwin ]' \
  'bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"'

# Status bar
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g window-status-style 'bg=#1e1e2e,fg=#6c7086'
set -g window-status-current-style 'bg=#89b4fa,fg=#1e1e2e,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '

# Bell, activity, and scrollback
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
set -g history-limit 50000

# Ctrl-a r reloads this configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
